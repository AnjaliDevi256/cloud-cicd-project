
name: Node.js CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build Docker Image
        run: docker build -t cloud-cicd-app .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Tag Docker Image
        run: docker tag cloud-cicd-app anjali256/cloud-cicd-app:latest

      - name: Push Docker Image
        run: docker push anjali256/cloud-cicd-app:latest

  deploy-staging:
    needs: build-test-and-publish
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Staging Deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Staging deploy hook secret is missing."
            exit 1
          fi
          curl --fail --show-error --silent \
            --request POST "$DEPLOY_HOOK"

      - name: Wait for Deployment Startup
        run: sleep 60

      - name: Verify Staging Health
        env:
          STAGING_URL: ${{ secrets.RENDER_STAGING_URL }}
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "Staging URL secret is missing."
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --max-time 10 "${STAGING_URL%/}/health"; then
              echo
              echo "Staging health check passed."
              exit 0
            fi

            echo "Health check attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done

          echo "Staging health check failed."
          exit 1
