
name: Node.js CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Build Docker Image
        run: docker build --build-arg APP_VERSION="${GITHUB_SHA}" -t cloud-cicd-app .

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Tag Docker Images
        run: |
          docker tag cloud-cicd-app anjali256/cloud-cicd-app:latest
          docker tag cloud-cicd-app anjali256/cloud-cicd-app:${GITHUB_SHA}

      - name: Push Versioned Docker Image
        run: docker push anjali256/cloud-cicd-app:${GITHUB_SHA}

      - name: Push Latest Docker Image
        run: docker push anjali256/cloud-cicd-app:latest

  deploy-staging:
    needs: build-test-and-publish
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Staging Deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Staging deploy hook secret is missing."
            exit 1
          fi
          curl --fail --show-error --silent \
            --request POST "$DEPLOY_HOOK"

      - name: Wait for Deployment Startup
        run: sleep 60

      - name: Verify Staging Health
        env:
          STAGING_URL: ${{ secrets.RENDER_STAGING_URL }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "Staging URL secret is missing."
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if response=$(curl --fail --silent \
              --show-error --max-time 10 \
              "${STAGING_URL%/}/health"); then

              if echo "$response" | jq -e \
                --arg expected "$EXPECTED_VERSION" \
                '.status == "healthy" and .version == $expected' \
                > /dev/null; then
                echo "Staging health check passed."
                echo "Verified version: $EXPECTED_VERSION"
                exit 0
              fi

              echo "Staging is responding, but the version is not updated yet."
            else
              echo "Staging is not responding yet."
            fi

            echo "Attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done

          echo "Staging health or version verification failed."
          exit 1

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger Production Deployment
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "Production deploy hook secret is missing."
            exit 1
          fi

          curl --fail --show-error --silent \
            --request POST "$DEPLOY_HOOK"

      - name: Wait for Production Deployment
        run: sleep 60

      - name: Verify Production Health
        env:
          PRODUCTION_URL: https://cloud-cicd-project-nuue.onrender.com
        run: |
          for attempt in $(seq 1 30); do
            if response=$(curl --fail --silent \
              --show-error --max-time 10 \
              "${PRODUCTION_URL%/}/health"); then

              if echo "$response" | jq -e \
                '.status == "healthy"' > /dev/null; then
                echo "Production health check passed."
                echo "$response"
                exit 0
              fi
            fi

            echo "Production check attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done

          echo "Production health check failed."
          exit 1
